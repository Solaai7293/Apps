<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSet Alarm</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #3498db;
            --text: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text);
        }

        /* Pages */
        .page { display: none; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #digital-clock { font-size: 2.5rem; font-weight: bold; color: var(--primary); }

        /* Time Selection Pane */
        .selection-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .pane { overflow-y: auto; padding: 10px; }
        .hours-pane { width: 35%; border-right: 1px solid #eee; }
        .minutes-pane { width: 65%; }

        .grid { display: grid; gap: 10px; }
        .hours-grid { grid-template-columns: repeat(2, 1fr); }
        .minutes-grid { grid-template-columns: repeat(5, 1fr); }

        .num-btn {
            padding: 15px 5px;
            text-align: center;
            background: #eee;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .num-btn.selected { background: var(--accent); color: white; }

        /* Controls */
        .controls { margin-top: 20px; display: grid; gap: 15px; }
        input[type="text"] { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .bottom-row { display: flex; justify-content: space-between; align-items: center; }

        /* Buttons */
        .btn { padding: 12px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--accent); color: white; }
        .btn-settings { background: var(--primary); color: white; }

        /* Alarm List */
        .alarm-item {
            background: white; margin-bottom: 10px; padding: 15px;
            border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
        }

        /* Ringing Overlay */
        #ringing-screen {
            position: fixed; top:0; left:0; width: 100%; height: 100%;
            background: var(--primary); color: white;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="main-page" class="page active">
        <div class="header">
            <div id="digital-clock">12:00 PM</div>
            <button class="btn btn-settings" onclick="showPage('settings-page')">Settings</button>
        </div>

        <div class="selection-container">
            <div class="pane hours-pane">
                <div class="grid hours-grid" id="hours-list"></div>
            </div>
            <div class="pane minutes-pane">
                <div class="grid minutes-grid" id="minutes-list"></div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="alarm-label" placeholder="Alarm Label (e.g. Gym)">
            <div class="bottom-row">
                <div>
                    Snooze: 
                    <select id="snooze-time">
                        <option value="5">5 mins</option>
                        <option value="10">10 mins</option>
                        <option value="15">15 mins</option>
                    </select>
                </div>
                <button class="btn btn-save" onclick="saveAlarm()">Save Alarm</button>
            </div>
        </div>
    </div>

    <div id="settings-page" class="page">
        <h2>Settings</h2>
        <label>Upload Ringtone:</label>
        <input type="file" id="ringtone-upload" accept="audio/*" onchange="loadRingtone(this)">
        <br><br>
        <label>Volume:</label>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.5">
        <br><br>
        <button class="btn btn-save" onclick="showPage('main-page')">Back</button>
    </div>

    <div id="list-page" class="page">
        <div class="header">
            <h2>Your Alarms</h2>
            <button class="btn" onclick="showPage('main-page')">+ New</button>
        </div>
        <div id="alarms-container"></div>
        <button class="btn" style="background: #e74c3c; color: white; margin-top: 10px;" onclick="deleteSelected()">Delete Selected</button>
    </div>

    <div id="ringing-screen">
        <h1 id="ring-time-display">00:00</h1>
        <h3 id="ring-label-display">Alarm</h3>
        <button class="btn" style="background: #2ecc71; color: white; margin: 10px;" onclick="stopAlarm()">Dismiss</button>
        <button class="btn" style="background: #f1c40f; color: white;" onclick="snoozeAlarm()">Snooze</button>
    </div>

    <audio id="alarm-audio" loop></audio>

    <script>
        let baseTime = new Date();
        let selectedHourAdd = 0;
        let selectedMinAdd = 0;
        let alarms = [];
        let activeAlarm = null;

        // Initialize UI
        function init() {
            const hList = document.getElementById('hours-list');
            for(let i=1; i<=12; i++) {
                let div = document.createElement('div');
                div.className = 'num-btn';
                div.innerText = i;
                div.onclick = () => selectHour(i, div);
                hList.appendChild(div);
            }

            const mList = document.getElementById('minutes-list');
            for(let i=1; i<=60; i++) {
                let div = document.createElement('div');
                div.className = 'num-btn';
                div.innerText = i;
                div.onclick = () => selectMin(i, div);
                mList.appendChild(div);
            }
            updateClockDisplay();
            setInterval(checkAlarms, 1000);
        }

        function selectHour(h, el) {
            document.querySelectorAll('.hours-pane .num-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedHourAdd = h;
            updateClockDisplay();
        }

        function selectMin(m, el) {
            document.querySelectorAll('.minutes-pane .num-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedMinAdd = m;
            updateClockDisplay();
        }

        function updateClockDisplay() {
            let displayDate = new Date(); 
            displayDate.setHours(displayDate.getHours() + selectedHourAdd);
            displayDate.setMinutes(displayDate.getMinutes() + selectedMinAdd);
            
            let hours = displayDate.getHours();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            let mins = displayDate.getMinutes().toString().padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${hours}:${mins} ${ampm}`;
            return displayDate;
        }

        function saveAlarm() {
            const time = updateClockDisplay();
            const alarm = {
                id: Date.now(),
                time: time.getTime(),
                label: document.getElementById('alarm-label').value || "Alarm",
                snooze: document.getElementById('snooze-time').value,
                enabled: true
            };
            alarms.push(alarm);
            renderAlarms();
            showPage('list-page');
        }

        function renderAlarms() {
            const container = document.getElementById('alarms-container');
            container.innerHTML = '';
            alarms.forEach(a => {
                const date = new Date(a.time);
                const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                container.innerHTML += `
                    <div class="alarm-item">
                        <input type="checkbox" class="del-check" data-id="${a.id}">
                        <div>
                            <strong>${timeStr}</strong><br>
                            <small>${a.label} (${a.snooze}m snooze)</small>
                        </div>
                        <button onclick="toggleAlarm(${a.id})">${a.enabled ? 'ON' : 'OFF'}</button>
                    </div>
                `;
            });
        }

        function checkAlarms() {
            const now = new Date().getTime();
            alarms.forEach(a => {
                if(a.enabled && now >= a.time) {
                    triggerAlarm(a);
                }
            });
        }

        function triggerAlarm(alarm) {
            activeAlarm = alarm;
            alarm.enabled = false; 
            document.getElementById('ring-time-display').innerText = new Date(alarm.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('ring-label-display').innerText = alarm.label;
            document.getElementById('ringing-screen').style.display = 'flex';
            const audio = document.getElementById('alarm-audio');
            audio.volume = document.getElementById('volume-control').value;
            audio.play().catch(e => console.log("Audio blocked: User interaction required"));
        }

        function stopAlarm() {
            document.getElementById('alarm-audio').pause();
            document.getElementById('ringing-screen').style.display = 'none';
            renderAlarms();
        }

        function snoozeAlarm() {
            if(activeAlarm) {
                activeAlarm.time = new Date().getTime() + (parseInt(activeAlarm.snooze) * 60000);
                activeAlarm.enabled = true;
                stopAlarm();
            }
        }

        function loadRingtone(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('alarm-audio').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function deleteSelected() {
            const checks = document.querySelectorAll('.del-check:checked');
            const idsToDelete = Array.from(checks).map(c => parseInt(c.getAttribute('data-id')));
            alarms = alarms.filter(a => !idsToDelete.includes(a.id));
            renderAlarms();
        }

        init();
    </script>
</body>
</html>
