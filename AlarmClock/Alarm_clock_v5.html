<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuietTime Alarm</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f9faff;
            --text: #2d3436;
            --accent: #00b894;
            --countdown: #e17055;
            --card: #ffffff;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Page Management */
        .page { display: none; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        #digital-clock { font-size: 2.8rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        #countdown-banner { color: var(--countdown); font-weight: 600; font-size: 0.95rem; margin-bottom: 15px; min-height: 1.2rem; }

        /* Layout Partition */
        .selection-pane {
            display: flex;
            flex: 1;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .pane-left { width: 35%; border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
        .pane-right { width: 65%; overflow-y: auto; padding: 10px; }

        /* Grids */
        .grid { display: grid; gap: 8px; }
        .grid-hours { grid-template-columns: repeat(2, 1fr); }
        .grid-mins { grid-template-columns: repeat(5, 1fr); }

        .num-btn {
            background: #f1f2f6;
            border: none;
            padding: 15px 5px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .num-btn.selected { background: var(--primary); color: white; transform: scale(0.95); }

        /* Form Elements */
        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        #label-input { 
            padding: 15px; border-radius: 12px; border: 1px solid var(--border); 
            font-size: 1rem; outline: none; background: var(--card);
        }
        
        .footer-row { display: flex; justify-content: space-between; align-items: center; }
        .snooze-box select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); }

        .btn { padding: 12px 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-save { background: var(--accent); color: white; }
        .btn-settings { background: var(--primary); color: white; padding: 8px 15px; border-radius: 8px; font-size: 0.8rem; }

        /* List Page */
        .alarm-item {
            background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 12px;
            display: flex; align-items: center; border: 1px solid var(--border);
        }
        .alarm-info { flex: 1; }
        .alarm-time { font-size: 1.4rem; font-weight: bold; }
        .toggle-switch { transform: scale(1.2); margin: 0 15px; }

        /* Ringing Overlay */
        #ringing-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--primary); color: white;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        #big-ring-clock { font-size: 5rem; font-weight: 800; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="main-page" class="page active">
        <div class="header">
            <div id="digital-clock">12:00 PM</div>
            <button class="btn-settings" onclick="go('settings-page')">Settings</button>
        </div>

        <div id="countdown-banner">Alarm off</div>

        <div class="selection-pane">
            <div class="pane-left">
                <div class="grid grid-hours" id="hours-grid"></div>
            </div>
            <div class="pane-right">
                <div class="grid grid-mins" id="mins-grid"></div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="label-input" placeholder="Alarm Label (e.g., Morning Coffee)">
            <div class="footer-row">
                <div class="snooze-box">
                    Snooze: 
                    <select id="snooze-select">
                        <option value="5">5 mins</option>
                        <option value="10">10 mins</option>
                        <option value="15">15 mins</option>
                    </select>
                </div>
                <button class="btn btn-save" onclick="saveAlarm()">Save Alarm</button>
            </div>
        </div>
    </div>

    <div id="list-page" class="page">
        <div class="header">
            <h2>Alarms</h2>
            <button class="btn-settings" onclick="go('main-page')">+ Add</button>
        </div>
        <div style="margin-bottom: 10px;">
            <button onclick="selectAll(true)">Select All</button>
            <button onclick="deleteSelected()" style="color: #e74c3c;">Delete</button>
        </div>
        <div id="alarms-container" style="overflow-y: auto; flex: 1;"></div>
    </div>

    <div id="settings-page" class="page">
        <h2>Settings</h2>
        <div style="background: white; padding: 20px; border-radius: 15px;">
            <p>Upload Ringtone:</p>
            <input type="file" id="ringtone-file" accept="audio/*">
            <p style="margin-top: 20px;">Volume:</p>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.7" style="width: 100%;">
        </div>
        <button class="btn" onclick="go('main-page')" style="margin-top: 20px; background: #dfe6e9;">Back</button>
    </div>

    <div id="ringing-screen">
        <div id="big-ring-clock">00:00</div>
        <h2 id="ring-label-disp">Wake Up!</h2>
        <div style="margin-top: 50px; display: flex; gap: 20px;">
            <button class="btn" style="background: #ff7675; color: white; padding: 20px 40px;" onclick="stopAlarm()">Dismiss</button>
            <button class="btn" style="background: #fab1a0; color: #2d3436; padding: 20px 40px;" onclick="snoozeCurrent()">Snooze</button>
        </div>
    </div>

    <audio id="alarm-audio" loop></audio>

    <script>
        let selectedH = null;
        let selectedM = null;
        let alarms = [];
        let ringingAlarm = null;

        // Populate Grids
        function init() {
            const hGrid = document.getElementById('hours-grid');
            for(let i=1; i<=12; i++) {
                let b = document.createElement('button');
                b.className = 'num-btn'; b.innerText = i;
                b.onclick = () => toggleVal('h', i, b);
                hGrid.appendChild(b);
            }

            const mGrid = document.getElementById('mins-grid');
            for(let i=1; i<=60; i++) {
                let b = document.createElement('button');
                b.className = 'num-btn'; b.innerText = i;
                b.onclick = () => toggleVal('m', i, b);
                mGrid.appendChild(b);
            }
            setInterval(updateDisplay, 1000);
            setInterval(checkAlarms, 1000);
        }

        function toggleVal(type, val, el) {
            if(type === 'h') {
                const prev = selectedH;
                selectedH = (prev === val) ? null : val;
                document.querySelectorAll('.pane-left .num-btn').forEach(btn => btn.classList.remove('selected'));
            } else {
                const prev = selectedM;
                selectedM = (prev === val) ? null : val;
                document.querySelectorAll('.pane-right .num-btn').forEach(btn => btn.classList.remove('selected'));
            }
            if ((type==='h' && selectedH !== null) || (type==='m' && selectedM !== null)) el.classList.add('selected');
            updateDisplay();
        }

        function updateDisplay() {
            let now = new Date();
            let target = new Date(now.getTime());
            
            if(selectedH) target.setHours(target.getHours() + selectedH);
            if(selectedM) target.setMinutes(target.getMinutes() + selectedM);

            let h = target.getHours();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            let m = target.getMinutes().toString().padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${h}:${m} ${ampm}`;

            // Countdown Logic
            if(selectedH === null && selectedM === null) {
                document.getElementById('countdown-banner').innerText = "Select hours or minutes to add";
                document.getElementById('countdown-banner').style.color = "#b2bec3";
            } else {
                let diff = target.getTime() - now.getTime();
                let dH = Math.floor(diff / 3600000);
                let dM = Math.floor((diff % 3600000) / 60000);
                document.getElementById('countdown-banner').innerText = `Alarm in: ${dH > 0 ? dH + ' hour ' : ''}${dM} mins`;
                document.getElementById('countdown-banner').style.color = "var(--countdown)";
            }
            return target;
        }

        function saveAlarm() {
            let time = updateDisplay();
            alarms.push({
                id: Date.now(),
                time: time.getTime(),
                label: document.getElementById('label-input').value || "Alarm",
                snooze: parseInt(document.getElementById('snooze-select').value),
                active: true,
                checked: false
            });
            // Reset UI
            selectedH = null; selectedM = null;
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('label-input').value = "";
            go('list-page');
            renderAlarms();
        }

        function renderAlarms() {
            const container = document.getElementById('alarms-container');
            container.innerHTML = '';
            alarms.forEach(a => {
                let d = new Date(a.time);
                let timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                container.innerHTML += `
                    <div class="alarm-item">
                        <input type="checkbox" ${a.checked ? 'checked' : ''} onchange="toggleCheck(${a.id})">
                        <div class="alarm-info">
                            <div class="alarm-time">${timeStr}</div>
                            <small>${a.label} (${a.snooze}m snooze)</small>
                        </div>
                        <input type="checkbox" class="toggle-switch" ${a.active ? 'checked' : ''} onchange="toggleActive(${a.id})">
                        <button onclick="deleteSingle(${a.id})" style="background:none; border:none; color:red; font-weight:bold;">✕</button>
                    </div>
                `;
            });
        }

        function toggleActive(id) { let a = alarms.find(x => x.id === id); if(a) a.active = !a.active; }
        function toggleCheck(id) { let a = alarms.find(x => x.id === id); if(a) a.checked = !a.checked; }
        function deleteSingle(id) { alarms = alarms.filter(a => a.id !== id); renderAlarms(); }
        function selectAll(val) { alarms.forEach(a => a.checked = val); renderAlarms(); }
        function deleteSelected() { alarms = alarms.filter(a => !a.checked); renderAlarms(); }

        function checkAlarms() {
            let now = new Date().getTime();
            alarms.forEach(a => {
                if(a.active && now >= a.time) {
                    triggerAlarm(a);
                }
            });
        }

        function triggerAlarm(a) {
            ringingAlarm = a;
            a.active = false;
            document.getElementById('big-ring-clock').innerText = new Date(a.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('ring-label-disp').innerText = a.label;
            document.getElementById('ringing-screen').style.display = 'flex';
            
            const audio = document.getElementById('alarm-audio');
            audio.volume = document.getElementById('vol-slider').value;
            audio.play().catch(e => alert("Alarm: " + a.label + " (Audio blocked by browser, click anywhere)"));
            renderAlarms();
        }

        function stopAlarm() {
            document.getElementById('alarm-audio').pause();
            document.getElementById('ringing-screen').style.display = 'none';
        }

        function snoozeCurrent() {
            if(ringingAlarm) {
                ringingAlarm.time = new Date().getTime() + (ringingAlarm.snooze * 60000);
                ringingAlarm.active = true;
                stopAlarm();
                renderAlarms();
            }
        }

        function go(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page).classList.add('active');
        }

        document.getElementById('ringtone-file').onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            document.getElementById('alarm-audio').src = url;
        };

        init();
    </script>
</body>
</html>
